apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-app
  labels:
    app: migration-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: migration-app

  template:
    metadata:
      labels:
        app: migration-app

    spec:
      containers:
      - name: migration-app
        image: <ECR_IMAGE_URL>:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: SERVER_PORT
          value: "8080"
